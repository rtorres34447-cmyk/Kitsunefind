          KITSUNE_V2_SOURCE
          unzip -t "$RUNNER_TEMP/kitsunefind-v2.zip" | tail -n 1
          unzip -q "$RUNNER_TEMP/kitsunefind-v2.zip" -d "$RUNNER_TEMP/kitsunefind-v2"
          test -f "$RUNNER_TEMP/kitsunefind-v2/settings.gradle"
          test -f "$RUNNER_TEMP/kitsunefind-v2/app/src/main/AndroidManifest.xml"
          echo "PROJECT_DIR=$RUNNER_TEMP/kitsunefind-v2" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure installed Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER" || { echo '::error::Android sdkmanager not found'; exit 1; }
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --console=plain :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KitsuneFind-V2-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
