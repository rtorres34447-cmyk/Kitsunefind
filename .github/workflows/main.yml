          KITSUNE_BASE64
          unzip -t "$RUNNER_TEMP/kitsunefind.zip" | tail -n 2
          unzip -q "$RUNNER_TEMP/kitsunefind.zip" -d "$RUNNER_TEMP/kitsunefind"
          test -f "$RUNNER_TEMP/kitsunefind/settings.gradle"
          echo "PROJECT_DIR=$RUNNER_TEMP/kitsunefind" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35 using preinstalled runner SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER" || { echo '::error::sdkmanager not found'; exit 1; }
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --console=plain :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kitsunefind-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
